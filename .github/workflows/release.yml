name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: tag must match VERSION (the version SSOT)
        run: |
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME != v$(cat VERSION) — bump VERSION before tagging"; exit 1; }
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv build
      - run: uv publish
