name: release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch: # re-run backstop if a publish fails after the bump landed

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)
      contents: write # push the derived release tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv build
      - run: uv publish # duplicate version on PyPI fails loudly here — natural no-op guard
      - name: tag the release (derived from VERSION, after successful publish)
        run: |
          git tag "v$(cat VERSION)"
          git push origin "v$(cat VERSION)"
